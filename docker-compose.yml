name: invoice-backend

services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Invoice Management API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DATABASE_URL: sqlite:////app/data/app.db
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-s3.jamicore.com}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-invoice-upload}
      MINIO_SECURE: ${MINIO_SECURE:-true}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  backend_data: